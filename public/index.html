<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicHero</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  img { width: 64px; height: 96px; object-fit: cover; border-radius: 4px; background: #222; }
</style>
</head>
<body>
<h1>ComicHero</h1>
<p>The server is running. The full reader arrives in the next step; for now this lists what it found.</p>
<ul id="list"></ul>
<script>
  fetch('/api/library').then((r) => r.json()).then(({ comics }) => {
    const list = document.getElementById('list');
    if (!comics.length) list.textContent = 'No comics found in the comics folder.';
    for (const c of comics) {
      const li = document.createElement('li');
      const img = document.createElement('img');
      if (c.hasCover) img.src = `/api/comics/${c.id}/cover`;
      const text = document.createElement('div');
      text.textContent = `${c.title} (${c.chapterCount} chapters)`;
      li.append(img, text);
      list.append(li);
    }
  });
</script>
</body>
</html>
